---
- name: Встановлення Node.js, NPM та Nginx
  apt:
    name:
      - nodejs
      - npm
      - nginx
    state: present
    update_cache: yes

- name: Створення системного користувача app
  user:
    name: app
    system: yes
    shell: /usr/sbin/nologin
    state: present

- name: Створення користувача operator із паролем
  user:
    name: operator
    password: "{{ '12345678' | password_hash('sha512') }}"
    shell: /bin/bash
    state: present

- name: Налаштування обмеженого sudo для operator
  copy:
    dest: /etc/sudoers.d/operator
    content: |
      operator ALL=(ALL) NOPASSWD: /bin/systemctl start mywebapp, /bin/systemctl stop mywebapp, /bin/systemctl restart mywebapp, /bin/systemctl status mywebapp, /bin/systemctl reload nginx
    validate: /usr/sbin/visudo -cf %s

- name: Створення директорії для застосунку
  file:
    path: /opt/mywebapp
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Копіювання вихідних файлів проєкту на сервер
  copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: /opt/mywebapp/
  loop:
    - package.json
    - package-lock.json
    - index.js
    - migrate.sh
    - prisma

- name: Генерація конфігураційного файлу застосунку (.env)
  template:
    src: env.j2
    dest: /opt/mywebapp/.env
    owner: app
    group: app
    mode: '0600'
  notify: Перезапуск mywebapp

- name: Встановлення NPM залежностей
  npm:
    path: /opt/mywebapp

- name: Зміна власника файлів на app (після встановлення модулів)
  file:
    path: /opt/mywebapp
    owner: app
    group: app
    recurse: yes

- name: Генерація Systemd-сервісу
  template:
    src: mywebapp.service.j2
    dest: /etc/systemd/system/mywebapp.service
  notify: Перезапуск mywebapp

- name: Увімкнення та запуск застосунку
  systemd:
    name: mywebapp
    state: started
    enabled: yes
    daemon_reload: yes

- name: Генерація конфігурації Nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/mywebapp
  notify: Перезапуск Nginx

- name: Активація конфігурації Nginx
  file:
    src: /etc/nginx/sites-available/mywebapp
    dest: /etc/nginx/sites-enabled/mywebapp
    state: link
  notify: Перезапуск Nginx

- name: Видалення дефолтного сайту Nginx
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Перезапуск Nginx

- name: Увімкнення та запуск Nginx
  systemd:
    name: nginx
    state: started
    enabled: yes